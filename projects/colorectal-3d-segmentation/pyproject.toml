[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorectal-3d-segmentation"
version = "0.1.0"
description = "Research starter for 3D colorectal tumor CT segmentation with PyTorch and MONAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "monai==1.6.1",
  "nibabel>=5.3",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
