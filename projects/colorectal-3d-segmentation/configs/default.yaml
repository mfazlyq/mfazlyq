data:
  manifest: data/manifest.json
  root: .
  cache_rate: 0.25
  num_workers: 2

preprocessing:
  # Select target spacing after inspecting the dataset's native spacing.
  target_spacing: [1.5, 1.5, 2.0]
  # CT Hounsfield-unit window; verify against the source dataset protocol.
  ct_window:
    min: -1000
    max: 1000
  orientation: RAS

model:
  name: unet_baseline
  in_channels: 1
  num_classes: 2
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

training:
  seed: 42
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  patch_size: [96, 96, 96]
  samples_per_volume: 2
  validation_interval: 1
  sliding_window_overlap: 0.25
  output_dir: outputs/baseline_unet
  device: auto
