[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-research-workbench"
version = "0.1.0"
description = "Local-first NIfTI viewer and segmentation evaluation workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.48,<2.0",
  "numpy>=1.26,<3.0",
  "nibabel>=5.3,<6.0",
  "plotly>=5.24,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
