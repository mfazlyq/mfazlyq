name: 3D segmentation starter tests

on:
  push:
    paths:
      - "projects/colorectal-3d-segmentation/**"
  pull_request:
    paths:
      - "projects/colorectal-3d-segmentation/**"

permissions:
  contents: read

jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/colorectal-3d-segmentation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free dataset manifest tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
