name: Medical AI Workbench tests

on:
  push:
    branches: [main]
    paths:
      - "projects/medical-ai-research-workbench/**"
      - ".github/workflows/medical-ai-workbench-tests.yml"
  pull_request:
    paths:
      - "projects/medical-ai-research-workbench/**"
      - ".github/workflows/medical-ai-workbench-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3.0" "nibabel>=5.3,<6.0"

      - name: Run unit tests
        env:
          PYTHONPATH: projects/medical-ai-research-workbench/src
        run: |
          python -m unittest discover -s projects/medical-ai-research-workbench/tests -v
